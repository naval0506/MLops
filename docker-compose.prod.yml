services:

  spam-api:
    image: ${HARBOR_HOST:-localhost:5000}/spam-detector/spam-api:${IMAGE_TAG:-latest}
    container_name: spam-api
    restart: always
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - MODEL_PATH=/app/model/spam_model.pkl
      - METRICS_PATH=/app/model/metrics.json
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [spam-net]

networks:
  spam-net:
    driver: bridge
